<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Janty — The Game of Games</title>
<style>
  :root{
    --bg:#130b08; --panel:#1f1512; --panel2:#291b16; --line:#3d2a22;
    --amber:#ff9d3d; --amber2:#ffc169; --ember:#ff5c1a; --wine:#a01e46;
    --beer:#e0a53a; --liquor:#8b5cf6; --ink:#f6e9df; --muted:#b79a8b;
    --good:#5fce7a; --bad:#ff6b6b; --shadow:0 12px 40px rgba(0,0,0,.55);
    --serif: Georgia, "Times New Roman", serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #3a1608 0%, transparent 60%),
      radial-gradient(800px 500px at 50% 110%, #2a0f06 0%, transparent 55%),
      var(--bg);
    color:var(--ink); font-family:var(--sans); min-height:100dvh;
    line-height:1.45; padding-bottom:96px;
  }
  h1,h2,h3{font-family:var(--serif); margin:0; letter-spacing:.02em}
  button{font-family:inherit; color:inherit; cursor:pointer; border:none; background:none}
  .wrap{max-width:860px; margin:0 auto; padding:16px}
  .center{text-align:center}
  .muted{color:var(--muted)}
  .small{font-size:.85rem}
  .tiny{font-size:.75rem}

  .topbar{position:sticky; top:0; z-index:40; backdrop-filter:blur(10px);
    background:linear-gradient(180deg, rgba(19,11,8,.96), rgba(19,11,8,.72));
    border-bottom:1px solid var(--line)}
  .topbar .inner{max-width:860px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:10px}
  .brand{font-family:var(--serif); font-size:1.05rem; line-height:1.05}
  .brand small{display:block; color:var(--amber); font-size:.66rem; letter-spacing:.22em; text-transform:uppercase; font-family:var(--sans)}
  .spacer{flex:1}
  .clock{font-variant-numeric:tabular-nums; font-weight:700; font-size:1.05rem; color:var(--amber2);
    border:1px solid var(--line); border-radius:10px; padding:4px 10px; background:var(--panel)}
  .clock.warn{color:var(--bad); animation:pulse .9s infinite}
  @keyframes pulse{50%{opacity:.45}}

  .flame{height:6px; border-radius:6px; background:linear-gradient(90deg,var(--ember),var(--amber),var(--amber2),var(--amber),var(--ember)); filter:blur(.4px)}

  .card{background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--line);
    border-radius:18px; padding:18px; box-shadow:var(--shadow)}
  .card + .card{margin-top:14px}
  .card h2{font-size:1.5rem}
  .card h3{font-size:1.15rem; color:var(--amber2)}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:linear-gradient(180deg,#ff9d3d,#ef7a1d); color:#241206; font-weight:800;
    padding:14px 18px; border-radius:14px; font-size:1rem; box-shadow:0 6px 0 #a24c10;
    transition:transform .06s ease, box-shadow .06s ease; user-select:none}
  .btn:active{transform:translateY(3px); box-shadow:0 3px 0 #a24c10}
  .btn.block{width:100%}
  .btn.ghost{background:var(--panel); color:var(--ink); border:1px solid var(--line); box-shadow:none; font-weight:700}
  .btn.ghost:active{transform:translateY(1px)}
  .btn.good{background:linear-gradient(180deg,#6fe08a,#41b862); box-shadow:0 6px 0 #2c8145; color:#07220f}
  .btn.bad{background:linear-gradient(180deg,#ff8a8a,#e64d4d); box-shadow:0 6px 0 #9e2f2f; color:#2a0606}
  .btn.small{padding:9px 12px; font-size:.85rem; box-shadow:0 4px 0 #a24c10}
  .btn.ghost.small{box-shadow:none}
  .row{display:flex; gap:10px; flex-wrap:wrap}
  .row.tight{gap:8px}
  .grid{display:grid; gap:10px}

  .field{display:flex; flex-direction:column; gap:6px}
  .field label{font-size:.78rem; color:var(--muted); text-transform:uppercase; letter-spacing:.12em}
  input[type=text], select{
    background:#160e0b; border:1px solid var(--line); color:var(--ink);
    border-radius:12px; padding:12px; font-size:1rem; width:100%; font-family:inherit}
  input[type=text]:focus, select:focus{outline:2px solid var(--amber); outline-offset:1px}

  .player-setup{display:flex; gap:12px; align-items:flex-start}
  .avatar-btn{width:64px; height:64px; flex:0 0 64px; border-radius:16px; border:1px solid var(--line);
    background:#160e0b; font-size:2rem; display:flex; align-items:center; justify-content:center}
  .avatar-btn:active{transform:scale(.96)}
  .avatar-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(48px,1fr)); gap:8px}
  .avatar-grid button{aspect-ratio:1; font-size:1.6rem; border-radius:12px; border:1px solid var(--line); background:#160e0b}
  .avatar-grid button.sel{border-color:var(--amber); background:#3a2314}

  .track{display:flex; align-items:center; gap:12px; padding:12px; border-radius:16px;
    border:1px solid var(--line); background:linear-gradient(180deg,var(--panel2),var(--panel))}
  .track.active{border-color:var(--amber); box-shadow:0 0 0 2px rgba(255,157,61,.25), var(--shadow)}
  .track.done{opacity:.72}
  .track .who{display:flex; align-items:center; gap:10px; min-width:0; flex:1}
  .track .ava{font-size:1.9rem; width:44px; text-align:center}
  .track .nm{font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .track .tn{font-size:.72rem; color:var(--muted)}
  .pips{display:flex; gap:6px}
  .pip{width:16px; height:16px; border-radius:50%; border:2px solid var(--line); background:#120b09}
  .pip.on{background:var(--amber); border-color:var(--amber2); box-shadow:0 0 10px rgba(255,157,61,.6)}
  .levels{display:flex; gap:14px; flex-wrap:wrap}
  .lvltag{font-size:.62rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); text-align:center; margin-bottom:4px}
  .lvldone{color:var(--good); font-weight:800; font-size:.8rem; text-align:center}

  .badge{display:inline-block; font-size:.68rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
    padding:5px 10px; border-radius:999px; border:1px solid var(--line); background:#160e0b}
  .badge.trivia{color:#8fd0ff; border-color:#2b5b7a}
  .badge.puzzle{color:#ffd479; border-color:#7a6320}
  .badge.artistry{color:#ff9ad5; border-color:#7a2b5f}
  .badge.chance{color:#c7b6ff; border-color:#4b3a7a}
  .badge.body{color:#8fffb0; border-color:#2b7a45}
  .badge.spirit{color:#ff9d3d; border-color:#7a4a1f}
  .badge.black{color:#fff; background:#000; border-color:#444}

  .overlay{position:fixed; inset:0; z-index:80; background:rgba(8,4,2,.78); backdrop-filter:blur(6px);
    display:flex; align-items:flex-start; justify-content:center; padding:16px; overflow:auto}
  .overlay .card{max-width:640px; width:100%; margin:auto}
  .card.enter{animation:rise .22s ease}
  @keyframes rise{from{transform:translateY(14px); opacity:0} to{transform:none; opacity:1}}

  .banner{border-radius:16px; padding:14px; border:1px dashed var(--line); background:#160e0b}
  .banner.hot{border-color:var(--amber); background:linear-gradient(180deg,#3a2010,#241209)}

  .count{font-size:4rem; font-weight:900; font-variant-numeric:tabular-nums; color:var(--amber2); text-align:center; font-family:var(--serif)}
  .shake{animation:shake .5s}
  @keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px) rotate(-1deg)}40%{transform:translateX(8px) rotate(1deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

  .steps{counter-reset:s; padding-left:0; list-style:none; margin:0}
  .steps li{position:relative; padding-left:34px; margin:10px 0}
  .steps li::before{counter-increment:s; content:counter(s); position:absolute; left:0; top:-2px;
    width:24px; height:24px; border-radius:50%; background:var(--amber); color:#241206; font-weight:900;
    display:flex; align-items:center; justify-content:center; font-size:.8rem}
  .check{display:flex; gap:10px; align-items:flex-start; padding:10px; border:1px solid var(--line); border-radius:12px; background:#160e0b; margin:8px 0}
  .check input{width:22px; height:22px; margin-top:2px; accent-color:var(--amber)}
  .log{font-size:.82rem; color:var(--muted); max-height:120px; overflow:auto; border-top:1px solid var(--line); margin-top:8px; padding-top:8px}
  .log div{padding:2px 0}
  .fireburst{position:fixed; inset:0; pointer-events:none; z-index:90; overflow:hidden}
  .fireburst span{position:absolute; top:-40px; font-size:1.6rem; animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg); opacity:.15}}
  .footer{position:fixed; bottom:0; left:0; right:0; z-index:45; background:linear-gradient(0deg, rgba(19,11,8,.98), rgba(19,11,8,.7));
    border-top:1px solid var(--line); padding:10px 16px}
  .footer .inner{max-width:860px; margin:0 auto}
</style>
</head>
<body>
<div class="topbar">
  <div class="flame"></div>
  <div class="inner">
    <div class="brand">Janty<small>The Game of Games</small></div>
    <div class="spacer"></div>
    <div id="clock" class="clock" hidden>15:00</div>
    <button class="btn ghost small" data-action="open-rules">Rules</button>
    <button class="btn ghost small" data-action="menu">Menu</button>
  </div>
</div>

<main id="root" class="wrap"></main>
<div id="modal"></div>
<div id="burst" class="fireburst"></div>
<div id="footer" class="footer" hidden><div class="inner" id="footerInner"></div></div>

function beep(freq, dur){
  try{
    var ctx = beep.ctx || (beep.ctx = new (window.AudioContext||window.webkitAudioContext)());
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = freq; o.type = "sine";
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.25, ctx.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime+dur);
    o.start(); o.stop(ctx.currentTime+dur+.02);
  }catch(e){}
}

var NOTE_BASE = {C:0,"C#":1,D:2,"D#":3,E:4,F:5,"F#":6,G:7,"G#":8,A:9,"A#":10,B:11};
function noteFreq(name){
  var m = /^([A-G]#?)(\d)$/.exec(name);
  if(!m) return 440;
  var semi = NOTE_BASE[m[1]] + (parseInt(m[2],10)+1)*12;
  return 440 * Math.pow(2, (semi-69)/12);
}

var MELODIES = [
  {name:"Ode to Joy", tempo:0.42, notes:["E4","E4","F4","G4","G4","F4","E4","D4","C4","C4","D4","E4","E4","D4","D4","D4"]},
  {name:"Für Elise", tempo:0.27, notes:["E5","D#5","E5","D#5","E5","B4","D5","C5","A4","C4","E4","A4","B4","E4","G#4","B4","C5"]},
  {name:"Minuet in G", tempo:0.32, notes:["D5","G4","A4","B4","C5","D5","G4","G4","E5","C5","D5","E5","F#5","G5","G4","G4"]},
  {name:"Eine kleine Nachtmusik", tempo:0.30, notes:["G4","D4","G4","D4","G4","D4","G4","B4","D5","C5","A4","C5","A4","F#4","A4","D5"]}
];

var Music = {
  ctx:null, gain:null, playing:false, loop:null, muted:false, current:"",
  init:function(){
    if(this.ctx) return;
    try{
      this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      this.gain = this.ctx.createGain();
      this.gain.gain.value = 0.45;
      this.gain.connect(this.ctx.destination);
    }catch(e){ this.ctx = null; }
  },
  voice:function(freq, start, dur, vol, type){
    var ctx = this.ctx, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq; o.connect(g); g.connect(this.gain);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol, start+0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, start+dur);
    o.start(start); o.stop(start+dur+0.05);
  },
  schedule:function(mel){
    if(!this.ctx) return;
    var ctx = this.ctx, t0 = ctx.currentTime + 0.08, t = t0;
    for(var k=0;k<mel.notes.length;k++){
      var f = noteFreq(mel.notes[k]);
      this.voice(f, t, mel.tempo*0.92, 0.16, "triangle");
      this.voice(f/2, t, mel.tempo*0.92, 0.06, "sine");
      t += mel.tempo;
    }
    var total = t - t0, self = this;
    this.loop = setTimeout(function(){ if(self.playing) self.schedule(self._mel); }, total*1000 + 300);
  },
  start:function(){
    this.init();
    if(!this.ctx) return;
    if(this.ctx.state==="suspended"){ this.ctx.resume(); }
    this.gain.gain.cancelScheduledValues(this.ctx.currentTime);
    this.gain.gain.setValueAtTime(0.45, this.ctx.currentTime);
    this.playing = true;
    this._mel = MELODIES[Math.floor(Math.random()*MELODIES.length)];
    this.current = this._mel.name;
    this.schedule(this._mel);
  },
  stop:function(){
    this.playing = false;
    if(this.loop){ clearTimeout(this.loop); this.loop = null; }
    if(this.ctx && this.gain){
      try{
        this.gain.gain.cancelScheduledValues(this.ctx.currentTime);
        this.gain.gain.setValueAtTime(this.gain.gain.value, this.ctx.currentTime);
        this.gain.gain.linearRampToValueAtTime(0.0001, this.ctx.currentTime+0.15);
      }catch(e){}
    }
  },
  toggle:function(){
    if(this.playing){ this.muted = true; this.stop(); }
    else { this.muted = false; this.start(); }
  }
};

function syncMusic(){
  if(S.phase==="ritual"){
    if(!Music.playing && !Music.muted) Music.start();
  } else if(Music.playing){
    Music.stop();
  }
}

/* ---------- multi-device sync (gun.js) ---------- */

var SYNC_STORE = "chardee_sync_v1";
var GunRef = {
  gun:null, node:null, last:null, ready:false, status:"off", pending:null,
  cfg:function(){
    try{ return JSON.parse(localStorage.getItem(SYNC_STORE)) || {}; }catch(e){ return {}; }
  },
  saveCfg:function(c){ try{ localStorage.setItem(SYNC_STORE, JSON.stringify(c)); }catch(e){} },
  load:function(cb){
    if(window.Gun) return cb(null);
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/gun/gun.js";
    s.onload = function(){ cb(window.Gun ? null : "Gun failed to initialise."); };
    s.onerror = function(){ cb("Could not load Gun.js — are you online?"); };
    document.head.appendChild(s);
  },
  connect:function(room, relay, cb){
    var self = this;
    self.status = "connecting";
    self.load(function(err){
      if(err){ self.status = "error"; cb(err); return; }
      var peers = (relay||"").split(",").map(function(x){return x.trim();}).filter(Boolean);
      try{
        self.gun = Gun(peers.length ? {peers:peers} : undefined);
      }catch(e){ self.status="error"; cb("Could not start Gun."); return; }
      self.node = self.gun.get("janty-rooms").get(room);
      self.last = null;
      self.received = false;
      self.node.get("state").on(function(data){
        if(!self.ready) return;
        if(typeof data !== "string") return;
        if(data === self.last) return;
        self.received = true;
        self.last = data;
        try{ applyRemote(JSON.parse(data)); }catch(e){}
      });
      self.ready = true;
      self.status = "on";
      self.saveCfg({room:room, relay:relay});
      setTimeout(function(){ if(self.ready && !self.received) self.push(true); }, 900);
      cb(null);
    });
  },
  push:function(force){
    if(!this.ready || !this.node) return;
    var json = JSON.stringify(S);
    if(!force && json === this.last) return;
    this.last = json;
    this.node.get("state").put(json);
  },
  disconnect:function(){
    this.ready = false;
    this.status = "off";
    try{ if(this.node) this.node.get("state").off(); }catch(e){}
    this.node = null;
    this.last = null;
    this.saveCfg({room:"", relay:""});
  }
};

function applyRemote(incoming){
  if(!incoming || !incoming.phase || !incoming.players) return;
  S = incoming;
  if(timerId){ clearInterval(timerId); timerId = null; }
  render();
  ensureClock();
  save(false);
}

function syncLabel(){
  if(GunRef.status==="on") return "📡 Synced";
  if(GunRef.status==="connecting") return "📡 Connecting…";
  if(GunRef.status==="error") return "📡 Sync error";
  return "📡 Multi-device sync";
}

function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

function activePlayer(){ return S.players[S.active]; }
function required(){ return S.config.cardsPerLevel; }
function levelLabel(i){ return S.config.levelNames[i] || ("Level "+(i+1)); }

function drawCard(){
  var lvl = activePlayer().level + 1;
  if(!S.decks[lvl] || !S.decks[lvl].length){ S.decks[lvl] = shuffle(DECKS[lvl].slice()); }
  return S.decks[lvl].pop();
}

function render(){
  if(!S) S = freshState();
  var root = byId("root");
  var footer = byId("footer");
  var clock = byId("clock");

  if(S.phase==="intro"){ root.innerHTML = viewIntro(); footer.hidden = true; clock.hidden = true; }
  else if(S.phase==="setup"){ root.innerHTML = viewSetup(); footer.hidden = true; clock.hidden = true; }
  else if(S.phase==="ritual"){ root.innerHTML = viewRitual(); footer.hidden = true; }
  else if(S.phase==="play"){ root.innerHTML = viewPlay(); footer.hidden = false; renderFooter(); }
  else if(S.phase==="over"){ root.innerHTML = viewOver(); footer.hidden = true; }

  if(S.phase==="play" && S.config.timerMin>0){ clock.hidden = false; }
  else { clock.hidden = true; }

  renderModal();
  renderClock();
  syncMusic();
}

function playerTrack(pl, idx){
  var lvl = pl.level;
  var lanes = [0,1,2].map(function(L){
    if(pl.done){ return '<div><div class="lvltag">'+levelLabel(L)+'</div><div class="lvldone">✓</div></div>'; }
    if(L < lvl){ return '<div><div class="lvltag">'+levelLabel(L)+'</div><div class="lvldone">✓</div></div>'; }
    if(L > lvl){ return '<div><div class="lvltag">'+levelLabel(L)+'</div><div class="muted tiny center">🔒</div></div>'; }
    var pips = "";
    for(var i=0;i<required();i++){ pips += '<span class="pip'+(i<pl.cards?' on':'')+'"></span>'; }
    return '<div><div class="lvltag">'+levelLabel(L)+'</div><div class="pips">'+pips+'</div></div>';
  }).join("");

  var flags = "";
  if(pl.skipNext) flags += ' <span class="badge">skip next</span>';
  if(pl.jail) flags += ' <span class="badge">in jail</span>';
  if(pl.accent) flags += ' <span class="badge">🌍 '+esc(pl.accent)+'</span>';
  if(!pl.done && pl.timeouts>0) flags += ' <span class="badge">⏱ '+pl.timeouts+'</span>';
  if(pl.done) flags += ' <span class="badge black">'+placeLabel(pl.place)+'</span>';

  var cls = "track" + (idx===S.active && !pl.done ? " active":"") + (pl.done?" done":"");
  return '<div class="'+cls+'">' +
      '<div class="who"><div class="ava">'+pl.avatar+'</div>' +
        '<div style="min-width:0"><div class="nm">'+esc(pl.name)+'</div>' +
          (pl.team?'<div class="tn">'+esc(pl.team)+'</div>':'')+flags+'</div></div>' +
      '<div class="levels">'+lanes+'</div>' +
    '</div>';
}

/* ---------- clock ---------- */

function clockRemaining(){
  if(S.timer && S.timer.endAt) return Math.max(0, Math.round((S.timer.endAt - Date.now())/1000));
  return (S.timer && S.timer.remaining) || 0;
}

function renderClock(){
  var c = byId("clock");
  if(!c || c.hidden) return;
  var r = clockRemaining();
  var m = Math.floor(r/60), s = r%60;
  c.textContent = m + ":" + (s<10?"0":"") + s;
  c.classList.toggle("warn", r<=120);
}

function tickClock(){
  if(!S || S.phase!=="play" || !S.timer.running) return;
  var r = clockRemaining();
  var prev = S.timer.remaining;
  S.timer.remaining = r;
  if(r===120 && prev!==120) beep(660,.15);
  if(r<=0){
    S.timer.running = false;
    S.timer.endAt = 0;
    beep(300,.6);
    if(S.finishedOrder.length){ endGame(); }
    else { S.modal = {kind:"blackcard"}; addLog("Clock expired — Black Card drawn."); render(); }
    return;
  }
  renderClock();
}

function startClock(){
  if(S.config.timerMin<=0){ S.timer = {total:0,remaining:0,running:false,endAt:0}; return; }
  S.timer.total = S.config.timerMin*60;
  S.timer.remaining = S.timer.total;
  S.timer.endAt = Date.now() + S.timer.total*1000;
  S.timer.running = true;
  if(timerId) clearInterval(timerId);
  timerId = setInterval(tickClock, 1000);
}

function ensureClock(){
  if(S.phase==="play" && S.timer && S.timer.running && S.timer.total>0){
    if(!timerId) timerId = setInterval(tickClock, 1000);
  }
}

/* ---------- flow ---------- */

function beginGame(){
  S.phase = "play";
  S.turn = 1;
  S.active = 0;
  S.log = [];
  S.decks = {1:shuffle(DECKS[1].slice()), 2:shuffle(DECKS[2].slice()), 3:shuffle(DECKS[3].slice())};
  S.finishedOrder = [];
  S.modal = {kind:"levelintro", level:1};
  addLog("The game begins. Level 1: Mind.");
  startClock();
  render();
}

function drawAndShow(){
  var c = drawCard();
  S.card = c;
  S.modal = {kind:"card", card:c};
  render();
}

function earnCard(player){
  player.cards++;
  addLog(player.name + " earned a card (" + player.cards + "/" + required() + " in " + levelLabel(player.level) + ").");
  if(player.cards >= required()){
    player.cards = 0;
    player.level++;
    if(player.level !== 1) player.accent = "";
    if(player.level >= 3){
      player.done = true;
      player.place = S.finishedOrder.length + 1;
      S.finishedOrder.push(player.id);
      addLog("🏆 " + player.name + " has conquered all three levels!");
      endGame();
      return "won";
    }
    addLog(player.name + " advanced to Level " + (player.level+1) + ": " + levelLabel(player.level) + ".");
    S.modal = {kind:"levelintro", level:player.level+1, thenEndTurn:true, playerId:player.id};
    return "advanced";
  }
  return "card";
}

function endGame(){
  S.phase = "over";
  S.timer.running = false;
  if(timerId){ clearInterval(timerId); timerId=null; }
  render();
}

function nextPlayer(){
  var n = S.players.length;
  var i = S.active;
  for(var k=0;k<n;k++){
    i = (i+1)%n;
    if(S.players[i].done) continue;
    if(S.players[i].skipNext){
      S.players[i].skipNext = false;
      addLog(S.players[i].name + " was skipped.");
      continue;
    }
    S.active = i;
    if(S.players[i].jail){ S.players[i].jail = false; addLog(S.players[i].name + " served their time — out of jail."); }
    return;
  }
}

function endTurn(){
  S.card = null;
  S.modal = null;
  S.turn++;
  nextPlayer();
  save();
  render();
}

function applyChance(c){
  var ap = activePlayer();
  switch(c.effect){
    case "everyone_else_sips":
      addLog("Everyone but " + ap.name + " sips."); break;
    case "skip":
      ap.skipNext = true; addLog(ap.name + " will skip the next turn."); break;
    case "jail":
      ap.jail = true; addLog(ap.name + " is in jail."); break;
    case "advance_card":
      ap.cards++; addLog(ap.name + " gained a free card."); break;
    case "swap":
      var others = S.players.filter(function(p){return p.id!==ap.id;});
      var o = others[Math.floor(Math.random()*others.length)];
      var t = ap.avatar; ap.avatar = o.avatar; o.avatar = t;
      addLog(ap.name + " and " + o.name + " swapped game pieces."); break;
    case "steal_leader":
      var lead = S.players.filter(function(p){return p.level===ap.level && p.id!==ap.id;})
        .sort(function(a,b){return b.cards-a.cards;})[0];
      if(lead && lead.cards>0){ lead.cards--; ap.cards++; addLog(ap.name + " stole a card from " + lead.name + "."); }
      else { addLog("No card to steal."); }
      break;
    default: addLog("Chance: " + ap.name + " — " + c.q);
  }
}

function dealHighCards(){
  var box = byId("hc");
  if(!box) return;
  var results = S.players.map(function(p){
    var r = RANKS[Math.floor(Math.random()*RANKS.length)];
    var s = SUITS[Math.floor(Math.random()*SUITS.length)];
    return {p:p, r:r, rank:RANKS.indexOf(r), suit:s};
  });
  var best = results.slice().sort(function(a,b){ return b.rank-a.rank; })[0];
  box.innerHTML = results.map(function(x){
    var win = x.p.id===best.p.id;
    return '<div class="track'+(win?' active':'')+'"><div class="who"><div class="ava">'+x.p.avatar+'</div>' +
      '<div><div class="nm">'+esc(x.p.name)+'</div></div></div>' +
      '<div style="font-size:1.4rem">'+x.r+x.suit+(win?' 🏆':'')+'</div></div>';
  }).join("");
  addLog("Black Card — High Card: " + best.p.name + " wins with " + best.r + best.suit + ".");
  beep(600,.2);
}

/* ---------- countdown ---------- */

function startCountdown(){
  var secs = (S.modal && S.modal.seconds) || 5;
  var end = (S.modal && S.modal.end) || "🍻";
  var drum = S.modal && S.modal.drum;
  var n = secs;
  var node = byId("cd");
  if(!node) return;
  node.textContent = n;
  beep(700,.12);
  var iv = setInterval(function(){
    n--;
    node = byId("cd");
    if(!node){ clearInterval(iv); return; }
    if(n<=0){ node.textContent = end; clearInterval(iv); beep(520,.2); return; }
    node.textContent = n;
    node.classList.remove("shake"); void node.offsetWidth; node.classList.add("shake");
    if(drum){ beep(150 + (n%2)*70, .12); } else { beep(700,.1); }
  }, 1000);
}

/* ---------- confetti ---------- */

function burst(){
  var b = byId("burst");
  var emo = ["🔥","🍷","🍺","🥃","💥","🏆","⚡","✨"];
  for(var i=0;i<48;i++){
    var s = document.createElement("span");
    s.textContent = emo[Math.floor(Math.random()*emo.length)];
    s.style.left = Math.random()*100 + "vw";
    s.style.animationDuration = (1.6 + Math.random()*1.8) + "s";
    s.style.animationDelay = (Math.random()*.6) + "s";
    b.appendChild(s);
  }
  setTimeout(function(){ b.innerHTML=""; }, 4200);
}

/* ---------- events ---------- */

document.addEventListener("click", function(e){
  var t = e.target.closest("[data-action]");
  var action = t ? t.getAttribute("data-action") : null;
  if(!action){
    if(e.target.getAttribute && e.target.getAttribute("data-overlay")==="1"){ S.modal=null; render(); }
    return;
  }
  var i = parseInt(t.getAttribute("data-i"), 10);

  switch(action){
    case "pick-avatar": S.modal={kind:"avatars", i:i}; render(); break;
    case "choose-avatar": S.players[i].avatar = t.getAttribute("data-emoji"); save(); render(); break;
    case "close-modal":
      if(S.modal && S.modal.thenEndTurn){ endTurn(); }
      else { S.modal=null; render(); }
      break;
    case "randomize":
      shuffle(AVATARS).slice(0,3).forEach(function(a,k){ S.players[k].avatar=a; }); render(); save(); break;
    case "to-setup": S.phase="setup"; save(); render(); break;
    case "to-ritual": S.phase="ritual"; Music.muted=false; save(); render(); break;
    case "music-toggle": Music.toggle(); render(); break;
    case "war-dance":
      S.modal = {kind:"countdown", seconds:15, end:"🪘", drum:true, doneLabel:"War dance complete",
        title:"🪘 War Dance!", sub:"Dance fiercely. Intimidate your opponents. Show off your physical prowess. Keep it up until the drum stops."};
      document.body.classList.add("shake");
      setTimeout(function(){ document.body.classList.remove("shake"); }, 900);
      addLog("A fierce war dance was performed. Intimidation achieved.");
      render();
      break;
    case "random-start":
      S.active = Math.floor(Math.random()*S.players.length);
      addLog("Fate chose " + activePlayer().name + " to go first.");
      render(); break;
    case "begin-game": beginGame(); break;
    case "draw": drawAndShow(); break;
    case "reveal":
      var ab = byId("answerBox"); if(ab) ab.style.display="block";
      t.style.display="none"; break;
    case "card-success":
      var p = activePlayer(); S.modal=null;
      var res = earnCard(p); save();
      if(res==="advanced"){ render(); }
      else if(res==="won"){ }
      else { endTurn(); }
      break;
    case "card-fail":
      S.modal = {kind:"steal", card:S.card}; render(); break;
    case "steal-by":
      var sid = parseInt(t.getAttribute("data-id"),10);
      var sp = S.players.find(function(x){return x.id===sid;});
      S.modal=null; addLog(sp.name + " stole the card from " + activePlayer().name + ".");
      var r2 = earnCard(sp); save();
      if(r2==="advanced"){ render(); }
      else if(r2==="won"){ }
      else { endTurn(); }
      break;
    case "steal-none":
      S.modal=null; addLog("The card went unclaimed."); endTurn(); break;
    case "chance-done":
      applyChance(S.card); S.modal=null; save(); endTurn(); break;
    case "pass":
      addLog(activePlayer().name + " passed."); endTurn(); break;
    case "timeout":
      var tid = parseInt(t.getAttribute("data-id"),10);
      var tp = S.players.find(function(x){return x.id===tid;});
      if(tp && tp.timeouts>0){
        tp.timeouts--;
        addLog(tp.name + " called a timeout (" + tp.timeouts + " left). Play pauses.");
        beep(420,.2); setTimeout(function(){ beep(320,.25); }, 220);
      }
      save(); render(); break;
    case "infraction":
      S.ui.inf = {ids:[], type:"Question asked"}; S.modal={kind:"infraction"}; render(); break;
    case "inf-toggle":
      var id = parseInt(t.getAttribute("data-id"),10);
      var arr = S.ui.inf.ids, idx = arr.indexOf(id);
      if(idx>=0) arr.splice(idx,1); else arr.push(id);
      renderModal(); break;
    case "inf-type":
      S.ui.inf.type = t.getAttribute("data-type"); renderModal(); break;
    case "inf-enforce":
      if(!S.ui.inf.ids.length){ return; }
      var names = S.ui.inf.ids.map(function(id){ return S.players.find(function(p){return p.id===id;}).name; }).join(", ");
      addLog("Infraction (" + S.ui.inf.type + "): " + names + ".");
      S.modal={kind:"countdown", title:"Sip for 5 seconds", sub:infractionText(S.ui.inf)}; render(); break;
    case "blackcard":
      S.modal={kind:"blackcard", black:BLACK_CARDS[Math.floor(Math.random()*BLACK_CARDS.length)]}; render(); break;
    case "highcard":
      dealHighCards(); break;
    case "spin-accent":
      var pid = parseInt(t.getAttribute("data-id"),10);
      var pp = S.players.find(function(x){return x.id===pid;});
      if(pp && pp.level===1 && !pp.accent){
        pp.accent = ACCENTS[Math.floor(Math.random()*ACCENTS.length)];
        addLog(pp.name + " must speak as: " + pp.accent + ".");
        beep(500,.15);
      }
      save(); render(); break;
    case "open-rules": S.modal={kind:"rules"}; render(); break;
    case "open-sync": S.modal={kind:"sync"}; render(); break;
    case "sync-connect":
      var rc = ((S.modal && S.modal.room)||"").trim();
      var rl = ((S.modal && S.modal.relay)||"").trim();
      if(!rc){ S.modal.err = "Enter a room code first."; renderModal(); break; }
      S.modal.err = "Connecting…";
      renderModal();
      GunRef.connect(rc, rl, function(err){
        S.modal = {kind:"sync", room:rc, relay:rl, err:err||null};
        render();
      });
      break;
    case "sync-disconnect":
      var dcr = (S.modal && S.modal.room)||"", dcl = (S.modal && S.modal.relay)||"";
      GunRef.disconnect(); S.modal={kind:"sync", room:dcr, relay:dcl}; render(); break;
    case "menu": S.modal={kind:"menu"}; render(); break;
    case "save-note": addLog("Progress is saved on this device."); renderModal(); break;
    case "confirm-reset":
      if(confirm("Reset the entire game? This cannot be undone.")){ clearSave(); S=freshState(); if(timerId){clearInterval(timerId); timerId=null;} render(); }
      break;
    case "smash": burst(); beep(120,.5); break;
    case "new-game":
      clearSave(); if(timerId){clearInterval(timerId); timerId=null;} S=freshState(); render(); break;
  }
});

document.addEventListener("input", function(e){
  var f = e.target.getAttribute && e.target.getAttribute("data-field");
  if(!f) return;
  var i = parseInt(e.target.getAttribute("data-i"),10);
  if(f==="name") S.players[i].name = e.target.value;
  else if(f==="team") S.players[i].team = e.target.value;
  else if(f==="cardsPerLevel") S.config.cardsPerLevel = parseInt(e.target.value,10);
  else if(f==="timerMin") S.config.timerMin = parseInt(e.target.value,10);
  else if(f==="customAvatar"){
    var v = e.target.value.trim();
    if(v){ S.players[i].avatar = v; render(); }
  }
  else if(f==="syncRoom"){ if(S.modal && S.modal.kind==="sync") S.modal.room = e.target.value; return; }
  else if(f==="syncRelay"){ if(S.modal && S.modal.kind==="sync") S.modal.relay = e.target.value; return; }
  save();
});

document.addEventListener("change", function(e){
  var f = e.target.getAttribute && e.target.getAttribute("data-field");
  if(!f) return;
  if(f==="cardsPerLevel" || f==="timerMin"){
    if(f==="cardsPerLevel") S.config.cardsPerLevel = parseInt(e.target.value,10);
    if(f==="timerMin") S.config.timerMin = parseInt(e.target.value,10);
    save(); render();
  }
});

/* ---------- boot ---------- */

S = load();
if(S && S.phase){
  if(!S.timer) S.timer = {total:0, remaining:0, running:false, endAt:0};
  if(S.players) S.players.forEach(function(p){
    if(p.timeouts==null) p.timeouts = 3;
    if(p.accent==null) p.accent = "";
  });
} else {
  S = freshState();
}
render();
ensureClock();
(function(){
  var cfg = GunRef.cfg();
  if(cfg.room){ GunRef.connect(cfg.room, cfg.relay||"", function(){ render(); }); }
})();
</script>
